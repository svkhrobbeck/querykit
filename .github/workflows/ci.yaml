name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - name: commitlint (PR)
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  release:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing (no NPM_TOKEN, no PR permissions)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Node + npm are needed for `npm publish` (invoked by scripts/ci-publish.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # OIDC trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      # Publish directly — versions are bumped locally (`bun run version-packages`)
      # and committed, so no changesets remain and nothing opens a PR. This
      # replaces changesets/action, which needed PR-creation permission and went
      # red on the post-publish GitHub-Release step. `scripts/ci-publish.mjs`
      # publishes only versions not yet on npm, via OIDC trusted publishing.
      - name: Publish (version-gated, OIDC)
        run: bun run release
        env:
          # No NPM_TOKEN: auth comes from OIDC trusted publishing (id-token: write).
          NPM_CONFIG_PROVENANCE: "true"
